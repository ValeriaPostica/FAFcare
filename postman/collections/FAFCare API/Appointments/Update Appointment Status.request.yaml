$kind: http-request
url: "{{base_url}}/api/appointments/{{appointment_id}}"
method: PATCH
headers:
  Authorization: Bearer {{jwt_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "confirmed"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200, 404, or 401', () => pm.expect(pm.response.code).to.be.oneOf([200, 404, 401]));
    language: text/javascript
order: 3000
