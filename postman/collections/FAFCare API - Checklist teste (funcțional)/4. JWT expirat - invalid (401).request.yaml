$kind: http-request
name: 4. JWT expirat / invalid (401)
url: "{{base_url}}/api/appointments"
method: GET
headers:
  Authorization: Bearer {{garbage_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      // Notă: authenticate() întoarce 401 identic atât pentru semnătură invalidă cât și pentru token expirat.
      // Pentru un test cu expirare REALĂ: setează temporar JWT_EXPIRES_IN=2s în backend/.env, repornește
      // backendul, rulează login-ul de mai sus, așteaptă câteva secunde, apoi rulează acest request cu
      // {{patient_jwt}} în loc de {{garbage_token}} - vei primi "Authentication token expired".
    language: text/javascript
order: 11000
