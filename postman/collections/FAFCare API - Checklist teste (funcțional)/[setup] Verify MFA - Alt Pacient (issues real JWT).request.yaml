$kind: http-request
url: "{{base_url}}/api/auth/verify-mfa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mfaToken": "{{other_patient_mfa_token}}",
      "otpCode": "{{other_patient_otp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Alt Pacient: MFA verified, token issued (200)', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.environment.set('other_patient_jwt', json.token);
          
          if (json.user.patient_id) pm.environment.set('other_patient_id', json.user.patient_id);
          if (json.user.doctor_id) pm.environment.set('other_patient_id', json.user.doctor_id);
      } else {
          console.error('Alt Pacient MFA verify failed:', pm.response.text());
      }
    language: text/javascript
order: 4000
