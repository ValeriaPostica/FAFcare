$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{patient_email}}",
      "password": "{{patient_password}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200 - credentiale corecte acceptate', () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
