$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{other_patient_email}}",
      "password": "{{other_patient_password}}"
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('other_patient_password', (pm.environment.get('seed_password') || 'Password123!') + '-Patient-' + pm.environment.get('other_patient_csv_id') + '!');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Alt Pacient: login step 1 returns 200', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.environment.set('other_patient_mfa_token', json.mfaToken);
          if (json.otpCode) {
              pm.environment.set('other_patient_otp', json.otpCode);
          } else {
              console.warn('Alt Pacient: no otpCode returned. Set MFA_RETURN_OTP=true in backend .env, or paste the code from the backend console log into other_patient_otp manually and re-run the next request.');
          }
      } else {
          console.error('Alt Pacient login failed:', pm.response.text());
      }
    language: text/javascript
order: 3000
