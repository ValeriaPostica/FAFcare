$kind: http-request
url: "{{base_url}}/api/medical-records"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctor_jwt}}
body:
  type: json
  content: |-
    {
      "patient_id": "{{patient_id}}",
      "diagnosis": "Routine follow-up assessment",
      "diagnosis_type": "other",
      "notes": "Patient is stable.",
      "recommendations": "Continue current care plan."
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
