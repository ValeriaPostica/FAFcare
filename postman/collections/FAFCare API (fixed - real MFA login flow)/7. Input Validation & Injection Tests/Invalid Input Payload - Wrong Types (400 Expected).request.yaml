$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient_jwt}}
body:
  type: json
  content: |-
    {
      "doctor_id": 12345,
      "appointment_type": 12345
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 1000
