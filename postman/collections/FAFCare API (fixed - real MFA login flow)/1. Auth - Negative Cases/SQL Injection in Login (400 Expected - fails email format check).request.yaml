$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "' OR '1'='1",
      "password": "' OR '1'='1"
    }
scripts:
  - type: afterResponse
    code: pm.test('SQLi payload rejected by input validation (400)', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
