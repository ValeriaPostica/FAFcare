$kind: http-request
name: Garbage/Invalid-Signature JWT (401 Expected)
url: "{{base_url}}/api/appointments"
method: GET
headers:
  Authorization: Bearer {{garbage_token}}
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
