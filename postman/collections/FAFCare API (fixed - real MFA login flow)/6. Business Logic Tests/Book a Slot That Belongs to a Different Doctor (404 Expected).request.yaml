$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{other_patient_jwt}}
body:
  type: json
  content: |-
    {
      "doctor_id": "{{doctor_id}}",
      "schedule_slot_id": "{{doctor2_schedule_slot_id}}",
      "appointment_type": "offline",
      "scheduled_at": "{{doctor2_scheduled_at}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 404 (slot/doctor mismatch)', () => pm.response.to.have.status(404));
    language: text/javascript
order: 2000
