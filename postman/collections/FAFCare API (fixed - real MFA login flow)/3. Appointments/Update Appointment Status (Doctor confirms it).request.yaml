$kind: http-request
url: "{{base_url}}/api/appointments/{{appointment_id}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctor_jwt}}
body:
  type: json
  content: |-
    {
      "status": "confirmed"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 or 404', () => pm.expect(pm.response.code).to.be.oneOf([200, 404]));
    language: text/javascript
order: 3000
