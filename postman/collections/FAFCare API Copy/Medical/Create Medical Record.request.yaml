$kind: http-request
url: "{{base_url}}/api/medical-records"
method: POST
headers:
  Authorization: Bearer {{jwt_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patient_id": "{{patient_id}}",
      "doctor_id": "{{doctor_id}}",
      "diagnosis": "Routine follow-up assessment",
      "diagnosis_type": "other",
      "notes": "Patient is stable.",
      "recommendations": "Continue current care plan."
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201 or 401', () => pm.expect(pm.response.code).to.be.oneOf([201, 401]));
    language: text/javascript
order: 2000
