$kind: http-request
url: "{{base_url}}/api/patients/{{patient_id}}/medical-records"
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 or 401', () => pm.expect(pm.response.code).to.be.oneOf([200, 401]));
    language: text/javascript
order: 1000
