$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "' OR '1'='1",
      "password": "' OR '1'='1"
    }
scripts:
  - type: afterResponse
    code: pm.test('SQLi Blocked (400 or 401)', () => pm.expect(pm.response.code).to.be.oneOf([400, 401]));
    language: text/javascript
order: 3000
