$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "patient@example.com",
      "password": "CorrectPassword123!"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const response = pm.response.json();
          const token = response.token || response.accessToken || response.jwt_token;
          if (token) { pm.environment.set('jwt_token', token); }
      }
    language: text/javascript
order: 1000
