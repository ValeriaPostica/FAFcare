$kind: http-request
url: "{{base_url}}/api/medical-records"
method: POST
headers:
  Authorization: Bearer {{patient_jwt}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patient_id": "{{other_patient_id}}",
      "diagnosis": "Unauthorized test record",
      "diagnosis_type": "other"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403 or 401', () => pm.expect(pm.response.code).to.be.oneOf([403, 401]));
    language: text/javascript
order: 1000
