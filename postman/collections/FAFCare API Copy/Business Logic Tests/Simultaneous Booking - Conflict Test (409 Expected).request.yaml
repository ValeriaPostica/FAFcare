$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Authorization: Bearer {{other_patient_jwt}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "doctor_id": "{{doctor_id}}",
      "schedule_slot_id": "{{taken_slot_id}}",
      "appointment_type": "offline",
      "scheduled_at": "{{scheduled_at}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409 or 401', () => pm.expect(pm.response.code).to.be.oneOf([409, 401]));
    language: text/javascript
order: 3000
